<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img"
     aria-label="Nodes: cc, cx and a plain chrome-proxy share the main tunnel (-L 8080 and -D 1080) to the active node jpvpn. chrome-proxy jp2 opens its own SOCKS tunnel on port 1183 to jpvpn2, a second VM in Japan; its Chrome profiles Default and work share that one tunnel and IP. chrome-proxy us opens a SOCKS tunnel on port 1182 to usvpn. The node list is fetched privately from one of your VMs over SSH (proxy-nodes --from jpvpn), or from DNS TXT records at _claude-proxy.example.com.">
  <style>
    svg  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .t   { fill: #1f2937; font-size: 13px; }
    .ts  { fill: #4b5563; font-size: 11px; }
    .tb  { fill: #1f2937; font-size: 14px; font-weight: 600; }
    .bg   { fill: #f8fafc; stroke: #e2e8f0; }
    .box  { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .pill { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
    .region { fill: #eef2f7; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .tube { fill: #42b983; fill-opacity: .08; stroke: #42b983; stroke-width: 1.5; }
    .c-tube  { fill: #42b983; }  .s-tube  { stroke: #42b983; }
    .c-http  { fill: #2563eb; }  .s-http  { stroke: #2563eb; }
    .c-socks { fill: #d97706; }  .s-socks { stroke: #d97706; }
    .c-us    { fill: #7c3aed; }  .s-us    { stroke: #7c3aed; }
    .chip    { fill: #fef3c7; stroke: #d97706; stroke-width: 1; }
    .chip-t  { fill: #78350f; font-weight: 600; }
    .act     { fill: #dcfce7; stroke: #42b983; stroke-width: 1; }
    .act-t   { fill: #14532d; font-weight: 600; }
    .vm-on   { fill: #ffffff; stroke: #42b983; stroke-width: 2; }
    .lane { fill: none; stroke-width: 2.5; stroke-dasharray: 7 7; animation: flow 1.1s linear infinite; }
    .bold { font-weight: 600; }
    @keyframes flow { to { stroke-dashoffset: -14; } }
    @media (prefers-reduced-motion: reduce) { .lane { animation: none; } }
    @media (prefers-color-scheme: dark) {
      .t, .tb { fill: #e5e7eb; }  .ts { fill: #cbd5e1; }
      .bg   { fill: #0f172a; stroke: #1e293b; }
      .box  { fill: #111827; stroke: #374151; }
      .pill { fill: #1f2937; stroke: #4b5563; }
      .region { fill: #162032; stroke: #475569; }
      .tube { fill: #4ade80; stroke: #4ade80; }
      .c-tube { fill: #4ade80; }  .s-tube { stroke: #4ade80; }
      .c-http { fill: #60a5fa; }  .s-http { stroke: #60a5fa; }
      .c-socks { fill: #fbbf24; } .s-socks { stroke: #fbbf24; }
      .c-us { fill: #a78bfa; }    .s-us { stroke: #a78bfa; }
      .chip { fill: #451a03; stroke: #fbbf24; }  .chip-t { fill: #fde68a; }
      .act  { fill: #14532d; stroke: #4ade80; }  .act-t  { fill: #dcfce7; }
      .vm-on { fill: #111827; stroke: #4ade80; }
    }
  </style>

  <rect x="1" y="1" width="958" height="468" rx="16" class="bg"/>
  <text x="480" y="36" text-anchor="middle" class="tb">One tunnel per node in use — Chrome profiles in the same data folder share their node's tunnel</text>

  <!-- ===== laptop ===== -->
  <rect x="24" y="60" width="260" height="352" rx="14" class="box"/>
  <text x="154" y="86" text-anchor="middle" class="tb">Your laptop</text>

  <rect x="44" y="106" width="200" height="32" rx="8" class="pill"/>
  <text x="144" y="127" text-anchor="middle" class="t mono">cc · cx · chrome-proxy</text>
  <text x="144" y="156" text-anchor="middle" class="ts">the active node — Claude, Codex, Chrome</text>
  <circle cx="284" cy="122" r="5" class="c-http"/>

  <rect x="44" y="186" width="200" height="32" rx="8" class="pill"/>
  <text x="144" y="207" text-anchor="middle" class="t mono">chrome-proxy jp2</text>
  <rect x="50" y="228" width="72" height="22" rx="11" class="chip"/>
  <text x="86" y="243" text-anchor="middle" class="mono chip-t" style="font-size:11px">Default</text>
  <rect x="128" y="228" width="110" height="22" rx="11" class="chip"/>
  <text x="183" y="243" text-anchor="middle" class="mono chip-t" style="font-size:11px">--profile work</text>
  <text x="144" y="270" text-anchor="middle" class="ts">2 profiles · 1 data folder · 1 tunnel</text>
  <circle cx="284" cy="202" r="5" class="c-socks"/>

  <rect x="44" y="322" width="200" height="32" rx="8" class="pill"/>
  <text x="144" y="343" text-anchor="middle" class="t mono">chrome-proxy us</text>
  <text x="144" y="372" text-anchor="middle" class="ts">its own data folder (…-us)</text>
  <circle cx="284" cy="338" r="5" class="c-us"/>

  <!-- ===== tunnels ===== -->
  <rect x="304" y="108" width="324" height="28" rx="14" class="tube"/>
  <rect x="304" y="188" width="324" height="28" rx="14" class="tube"/>
  <rect x="304" y="324" width="324" height="28" rx="14" class="tube"/>

  <line x1="284" y1="122" x2="648" y2="122" class="lane s-http"/><polygon points="648,116 660,122 648,128" class="c-http"/>
  <text x="466" y="100" text-anchor="middle" class="ts"><tspan class="mono c-http bold">main tunnel</tspan>   -L 8080 + -D 1080</text>
  <line x1="284" y1="202" x2="648" y2="202" class="lane s-socks"/><polygon points="648,196 660,202 648,208" class="c-socks"/>
  <text x="466" y="180" text-anchor="middle" class="ts"><tspan class="mono c-socks bold">own SOCKS tunnel :1183</tspan>   = 1180 + slot 3</text>
  <line x1="284" y1="338" x2="648" y2="338" class="lane s-us"/><polygon points="648,332 660,338 648,344" class="c-us"/>
  <text x="466" y="316" text-anchor="middle" class="ts"><tspan class="mono c-us bold">own SOCKS tunnel :1182</tspan>   = 1180 + slot 2</text>

  <circle r="4.5" class="c-http"><animateMotion dur="2.6s" repeatCount="indefinite" path="M284,122 H660"/></circle>
  <circle r="4.5" class="c-http"><animateMotion dur="2.6s" begin="-1.3s" repeatCount="indefinite" path="M284,122 H660"/></circle>
  <circle r="4.5" class="c-socks"><animateMotion dur="2.6s" begin="-0.4s" repeatCount="indefinite" path="M284,202 H660"/></circle>
  <circle r="4.5" class="c-socks"><animateMotion dur="2.6s" begin="-1.7s" repeatCount="indefinite" path="M284,202 H660"/></circle>
  <circle r="4.5" class="c-us"><animateMotion dur="2.6s" begin="-0.9s" repeatCount="indefinite" path="M284,338 H660"/></circle>

  <!-- ===== regions ===== -->
  <rect x="660" y="60" width="276" height="210" rx="14" class="region"/>
  <text x="676" y="82" class="tb">Japan</text>
  <text x="920" y="82" text-anchor="end" class="ts">several VMs, one region</text>

  <rect x="676" y="102" width="244" height="40" rx="8" class="vm-on"/>
  <text x="692" y="127" class="t mono bold">jpvpn</text>
  <rect x="800" y="111" width="110" height="22" rx="11" class="act"/>
  <text x="855" y="126" text-anchor="middle" class="act-t" style="font-size:11px">active · cc / cx</text>

  <rect x="676" y="182" width="244" height="40" rx="8" class="box"/>
  <text x="692" y="207" class="t mono bold">jpvpn2</text>
  <text x="904" y="207" text-anchor="end" class="ts">2nd JP VM · own IP</text>
  <text x="798" y="252" text-anchor="middle" class="ts">proxy-node jp2 would move cc / cx here</text>

  <rect x="660" y="286" width="276" height="126" rx="14" class="region"/>
  <text x="676" y="308" class="tb">US</text>

  <rect x="676" y="318" width="244" height="40" rx="8" class="box"/>
  <text x="692" y="343" class="t mono bold">usvpn</text>
  <text x="904" y="343" text-anchor="end" class="ts">slot 2</text>
  <text x="798" y="390" text-anchor="middle" class="ts">cc-stop closes every tunnel at once</text>

  <!-- ===== where the list comes from ===== -->
  <text x="480" y="446" text-anchor="middle" class="t">Node list: privately from a VM over SSH <tspan class="mono c-tube bold">proxy-nodes --from jpvpn</tspan>  (or public DNS <tspan class="mono">--domain</tspan>) · <tspan class="mono">proxy-nodes --refresh</tspan></text>
</svg>
