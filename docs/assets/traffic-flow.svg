<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img"
     aria-label="One SSH connection from the laptop to the VM carries two forwards: -L 8080 to the VM's tinyproxy for Claude and Codex, and -D 1080 SOCKS5 for Chrome. Direct traffic to the API is blocked by the network. proxy-node switches the VM; chrome-proxy can open extra SOCKS tunnels to other nodes.">
  <style>
    svg  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .t   { fill: #1f2937; font-size: 13px; }
    .ts  { fill: #6b7280; font-size: 11px; }
    .tb  { fill: #1f2937; font-size: 14px; font-weight: 600; }
    .box  { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .pill { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
    .tube { fill: #42b983; fill-opacity: .08; stroke: #42b983; stroke-width: 2.5; }
    .c-tube  { fill: #42b983; }  .s-tube  { stroke: #42b983; }
    .c-http  { fill: #2563eb; }  .s-http  { stroke: #2563eb; }
    .c-socks { fill: #d97706; }  .s-socks { stroke: #d97706; }
    .c-bad   { fill: #dc2626; }  .s-bad   { stroke: #dc2626; }
    .cloud   { fill: #eef2ff; stroke: #818cf8; stroke-width: 1.5; }
    .chip    { fill: #f1f5f9; stroke: #cbd5e1; }
    .chip-on { fill: #42b983; fill-opacity: .25; stroke: #42b983; stroke-width: 1.5; }
    .lane { fill: none; stroke-width: 2.5; stroke-dasharray: 7 7; animation: flow 1.1s linear infinite; }
    .out  { fill: none; stroke-width: 2; }
    .wall { stroke-width: 2; stroke-dasharray: 3 5; opacity: .8; }
    .x    { stroke-width: 2.5; stroke-linecap: round; }
    .bold { font-weight: 600; }
    @keyframes flow { to { stroke-dashoffset: -14; } }
    @media (prefers-reduced-motion: reduce) { .lane { animation: none; } }
    @media (prefers-color-scheme: dark) {
      .t, .tb { fill: #e5e7eb; }  .ts { fill: #9ca3af; }
      .box  { fill: #111827; stroke: #374151; }
      .pill, .chip { fill: #1f2937; stroke: #4b5563; }
      .tube { fill: #4ade80; stroke: #4ade80; }
      .c-tube { fill: #4ade80; }  .s-tube { stroke: #4ade80; }  .chip-on { fill: #4ade80; stroke: #4ade80; }
      .c-http { fill: #60a5fa; }  .s-http { stroke: #60a5fa; }
      .c-socks { fill: #fbbf24; } .s-socks { stroke: #fbbf24; }
      .c-bad { fill: #f87171; }   .s-bad { stroke: #f87171; }
      .cloud { fill: #1e1b4b; stroke: #818cf8; }
    }
  </style>
  <defs>
    <marker id="ah-out"   viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="c-tube"/></marker>
  </defs>

  <!-- ===== blocked direct path (top) ===== -->
  <line x1="150" y1="46" x2="866" y2="46" class="s-bad" style="fill:none;stroke-width:2;stroke-dasharray:4 6;opacity:.55"/>
  <text x="560" y="40" text-anchor="middle" class="ts">direct to api.anthropic.com / chatgpt.com — <tspan class="c-bad bold">blocked by the network</tspan></text>
  <line x1="280" y1="22" x2="280" y2="82" class="wall s-bad"/>
  <text x="280" y="16" text-anchor="middle" class="ts c-bad">restricted network</text>
  <g class="x s-bad"><line x1="273" y1="39" x2="287" y2="53"/><line x1="287" y1="39" x2="273" y2="53"/></g>
  <circle r="4" class="c-bad">
    <animateMotion dur="2.2s" repeatCount="indefinite" path="M150,46 H272"/>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.92;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- ===== laptop ===== -->
  <rect x="24" y="92" width="232" height="256" rx="14" class="box"/>
  <text x="140" y="118" text-anchor="middle" class="tb">Your laptop</text>
  <rect x="44" y="138" width="164" height="34" rx="8" class="pill"/>
  <text x="126" y="160" text-anchor="middle" class="t mono">claude · codex</text>
  <text x="126" y="188" text-anchor="middle" class="ts mono">HTTPS_PROXY=127.0.0.1:8080</text>
  <text x="126" y="203" text-anchor="middle" class="ts">(cc / cx set this for you)</text>
  <rect x="44" y="248" width="164" height="34" rx="8" class="pill"/>
  <text x="126" y="270" text-anchor="middle" class="t mono">Chrome</text>
  <text x="126" y="298" text-anchor="middle" class="ts mono">socks5://127.0.0.1:1080</text>
  <text x="126" y="313" text-anchor="middle" class="ts">(chrome-proxy, separate profile)</text>
  <circle cx="256" cy="155" r="5" class="c-http"/>
  <text x="248" y="141" text-anchor="end" class="ts mono c-http">:8080</text>
  <circle cx="256" cy="265" r="5" class="c-socks"/>
  <text x="248" y="251" text-anchor="end" class="ts mono c-socks">:1080</text>

  <!-- ===== the SSH tunnel ===== -->
  <rect x="302" y="112" width="340" height="206" rx="46" class="tube"/>
  <text x="472" y="100" text-anchor="middle" class="t c-tube bold">ONE SSH connection — key auth, encrypted</text>
  <text x="472" y="212" text-anchor="middle" class="ts mono">ssh -N -C -L 8080:127.0.0.1:8888 -D 1080 jpvpn</text>

  <line x1="256" y1="155" x2="672" y2="155" class="lane s-http"/><polygon points="672,149 684,155 672,161" class="c-http"/>
  <text x="472" y="143" text-anchor="middle" class="ts"><tspan class="mono c-http bold">-L 8080 → VM:8888</tspan>   HTTP proxy for Claude / Codex</text>
  <line x1="256" y1="265" x2="672" y2="265" class="lane s-socks"/><polygon points="672,259 684,265 672,271" class="c-socks"/>
  <text x="472" y="253" text-anchor="middle" class="ts"><tspan class="mono c-socks bold">-D 1080</tspan>   SOCKS5 for Chrome / other apps</text>
  <text x="472" y="300" text-anchor="middle" class="ts">Claude can't use SOCKS → HTTP proxy on the VM</text>

  <!-- packets: laptop → tunnel → VM → internet -->
  <circle r="4.5" class="c-http"><animateMotion dur="3s" repeatCount="indefinite" path="M256,155 H836 C856,155 864,185 878,196"/></circle>
  <circle r="4.5" class="c-http"><animateMotion dur="3s" begin="1s" repeatCount="indefinite" path="M256,155 H836 C856,155 864,185 878,196"/></circle>
  <circle r="4.5" class="c-http"><animateMotion dur="3s" begin="2s" repeatCount="indefinite" path="M256,155 H836 C856,155 864,185 878,196"/></circle>
  <circle r="4.5" class="c-socks"><animateMotion dur="3s" begin="0.5s" repeatCount="indefinite" path="M256,265 H836 C856,265 864,235 878,224"/></circle>
  <circle r="4.5" class="c-socks"><animateMotion dur="3s" begin="2s" repeatCount="indefinite" path="M256,265 H836 C856,265 864,235 878,224"/></circle>

  <!-- ===== VM ===== -->
  <rect x="664" y="92" width="192" height="256" rx="14" class="box"/>
  <text x="760" y="118" text-anchor="middle" class="tb">VM</text>
  <text x="760" y="134" text-anchor="middle" class="ts">sshd — your key is the auth</text>
  <rect x="684" y="138" width="152" height="34" rx="8" class="pill s-http"/>
  <text x="760" y="160" text-anchor="middle" class="t mono">tinyproxy :8888</text>
  <text x="760" y="188" text-anchor="middle" class="ts">127.0.0.1 only · CONNECT relay</text>
  <text x="760" y="203" text-anchor="middle" class="ts">(webproxy-manager)</text>
  <rect x="684" y="248" width="152" height="34" rx="8" class="pill s-socks"/>
  <text x="760" y="270" text-anchor="middle" class="t mono">SOCKS5 (ssh -D)</text>
  <text x="760" y="298" text-anchor="middle" class="ts">built into sshd, nothing to install</text>
  <text x="760" y="313" text-anchor="middle" class="ts">tunnel-only users get no shell</text>

  <path d="M836,155 C856,155 864,185 878,196" class="out s-tube" marker-end="url(#ah-out)"/>
  <path d="M836,265 C856,265 864,235 878,224" class="out s-tube" marker-end="url(#ah-out)"/>

  <!-- ===== internet ===== -->
  <rect x="878" y="150" width="70" height="120" rx="20" class="cloud"/>
  <text x="913" y="200" text-anchor="middle" class="t bold">Internet</text>
  <text x="913" y="218" text-anchor="middle" class="ts">Anthropic</text>
  <text x="913" y="233" text-anchor="middle" class="ts">OpenAI</text>
  <text x="913" y="248" text-anchor="middle" class="ts">web</text>

  <!-- ===== nodes strip ===== -->
  <text x="24" y="393" class="ts">Nodes:</text>
  <rect x="68" y="378" width="44" height="22" rx="11" class="chip-on"/><text x="90" y="393" text-anchor="middle" class="t mono" style="font-size:12px">jp</text>
  <rect x="120" y="378" width="44" height="22" rx="11" class="chip"/><text x="142" y="393" text-anchor="middle" class="t mono" style="font-size:12px">sg</text>
  <rect x="172" y="378" width="44" height="22" rx="11" class="chip"/><text x="194" y="393" text-anchor="middle" class="t mono" style="font-size:12px">us</text>
  <text x="302" y="386" class="ts"><tspan class="mono t" style="font-size:11px">proxy-node sg</tspan>  moves the whole tunnel to another VM</text>
  <text x="302" y="402" class="ts"><tspan class="mono t" style="font-size:11px">chrome-proxy us</tspan>  opens a 2nd SOCKS tunnel (:1182) with its own Chrome profile</text>
  <text x="302" y="418" class="ts">One key per person opens every node · <tspan class="mono">nodes.json</tspan> tells the profile where the VMs are</text>
</svg>
