<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Claude Code + Codex Guide</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Step-by-step guide to installing Claude Code & Codex and running them via a VM proxy">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <style>
    /* Custom tweaks for Light Theme */
    :root {
      --theme-color: #42b983; /* Vue Green */
    }
    /* Make code blocks look sharper */
    .markdown-section pre > code {
      font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
      font-size: 0.9rem;
    }
    /* Copy Button Styling for Light Mode */
    .docsify-copy-code-button {
      background: #f8f8f8;
      color: #666;
      border: 1px solid #ddd;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .docsify-copy-code-button:hover {
      background: #42b983; /* Green on hover */
      color: white;
      border-color: #42b983;
    }
  </style>
</head>
<body>
  <div id="app">Loading Guide...</div>

  <script>
    window.$docsify = {
      name: 'Claude Code + Codex Guide',
      repo: '',

      // Vercel excludes the reserved filename README.md from static output,
      // so the build copies README.md -> home.md and docsify loads that.
      homepage: 'home.md',

      auto2top: true,

      // One shared sidebar (docs/_sidebar.md, copied to /_sidebar.md at build)
      // for every route, so navigation is always visible.
      loadSidebar: true,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      // Resolve relative links against the current page (so docs pages can
      // link to their siblings the same way GitHub renders them).
      relativePath: true,
      subMaxLevel: 2,

      search: {
        placeholder: 'Search commands...',
        noData: 'No results!',
        paths: 'auto',
        depth: 3,
        // Bump to invalidate visitors' cached (pre-multi-page) search index.
        namespace: 'claude-codex-guide-v2'
      },

      copyCode: {
        buttonText : 'Copy',
        errorText  : 'Error',
        successText: 'Copied!'
      },

      // Turn ```mermaid fenced blocks into <div class="mermaid"> instead of code.
      markdown: {
        renderer: {
          code: function (code, lang) {
            if (lang === 'mermaid') {
              return '<div class="mermaid">' + code + '</div>';
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      },

      // After each page renders, draw the mermaid diagrams as SVG.
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            if (window.mermaid && typeof window.mermaid.run === 'function') {
              try { window.mermaid.run({ querySelector: '.mermaid' }); } catch (e) {}
            }
          });
        }
      ]
    }
  </script>
  
  <script src="//cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>mermaid.initialize({ startOnLoad: false, theme: 'default' });</script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>
</body>
</html>
